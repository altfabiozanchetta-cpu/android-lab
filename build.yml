name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compila APK debug
        run: gradle assembleDebug --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk gufo-metronomo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: gufo-metronomo.apk

      - name: Pubblica nelle Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" gufo-metronomo.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "APK di debug generato automaticamente dal commit ${{ github.sha }}"
